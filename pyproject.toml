[project]
name = "rl-dda-game"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "devforplus", email = "devforplus@gmail.com" }
]
dependencies = [
    "pyxel>=2.3.18",
    "pipe>=2.2",
    "toolz>=1.0.0",
    "ultralytics>=8.1.2",
    "opencv-python>=4.11.0.86",
    "torch>=2.4.1",
    "torchrl>=0.5.0",
    "pyautogui>=0.9.54",
    "pillow>=10.4.0",
    "wasm>=1.2",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
    "pywin32>=310; platform_system=='Windows'",
    "tensordict>=0.5.0",
    "requests>=2.32.3",
    "micropip>=0.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "helium>=5.1.0",
    "selenium>=4.24.0",
    "webdriver-manager>=4.0.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.game]
app_name = "VORTEXION"
app_version = "1.0"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.5",
    "pygbag>=0.9.2",
    "tomli>=2.2.1",
]

[tool.rye.scripts]

# 🚀 자주 사용하는 명령어 (EventLogger 통합)
collect-quick = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace quick-test --duration 30 --headless --verbose", env = { PYTHONPATH = "." } }
collect-full = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace full-test --duration 60 --headless --collect-all --save-raw --verbose", env = { PYTHONPATH = "." } }
dev = { cmd = "python scripts/dev.py", env = { PYTHONPATH = "." } }
test = { cmd = "python -m pytest", env = { PYTHONPATH = "src" } }
help = { cmd = "rye run --list", env = { PYTHONPATH = "." } }

# 🎮 Pyxel 데이터 수집 (EventLogger 통합)
collect = { cmd = "python -m scripts.cli", env = { PYTHONPATH = "." } }
collect-demo = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace demo --duration 30 --headless --verbose", env = { PYTHONPATH = "." } }
collect-game = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace gameplay --duration 120 --headless --collect-all --save-raw --verbose", env = { PYTHONPATH = "." } }
collect-infinite = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace infinite --headless --collect-all --save-raw --verbose", env = { PYTHONPATH = "." } }

# 🧪 테스트 및 예제
test-event-logger = { cmd = "python examples/event_logger_example.py", env = { PYTHONPATH = "." } }
test-collector = { cmd = "python -m scripts.cli --url http://0.0.0.0:5176/ --namespace test --duration 10 --headless --verbose", env = { PYTHONPATH = "." } }

# 🌐 서버
serve-game = { cmd = "python -m http.server 5176 -d web/agentic-game", env = { PYTHONPATH = "." } }
serve-simple = { cmd = "python -m http.server 5175 -d web/game", env = { PYTHONPATH = "." } }
serve-test = { cmd = "python -m http.server 8000", env = { PYTHONPATH = "." } }

# 🏗️ 빌드
build = { cmd = "python scripts/build.py", env = { PYTHONPATH = "." } }
build-agent = { cmd = "python scripts/build_agent.py", env = { PYTHONPATH = "." } }
clean = { cmd = "python scripts/clean.py", env = { PYTHONPATH = "." } }

# 🔄 워크플로우
dev-setup = { chain = ["clean", "build", "test"] }
game-workflow = { chain = ["serve-game", "collect-demo"] }
full-workflow = { chain = ["clean", "build", "serve-game", "collect-full"] }

# 🛠️ 기타
check-deps = { cmd = "python -c \"from scripts.cli.simple_pyxel_collector import check_selenium_dependency, check_websockets_dependency; print('✅ 모든 의존성 확인됨' if check_selenium_dependency() and check_websockets_dependency() else '❌ 의존성 오류')\"", env = { PYTHONPATH = "." } }

# 🔧 고급 명령어
extract-config = { cmd = "python scripts/extract_config.py", env = { PYTHONPATH = "." } }
build-all = { chain = ["build", "build-agent"] }
cleanup-config = { cmd = "python scripts/cleanup_config.py", env = { PYTHONPATH = "." } }
upload_data = { cmd = "python src/upload_game_data.py", env = { PYTHONPATH = "." } }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"] 
