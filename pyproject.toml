[project]
name = "rl-dda"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "devforplus", email = "dlwlgusdev@gmail.com" }
]
dependencies = [
    "numpy~=1.26.4",
    "pyxel>=2.5.11",
    "torch>=2.0.0",
    "matplotlib>=3.10.8",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rl_dda"]
