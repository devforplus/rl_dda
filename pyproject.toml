[project]
name = "rl-dda-game"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "devforplus", email = "devforplus@gmail.com" }
]
dependencies = [
    "pyxel>=2.3.18",
    "pipe>=2.2",
    "toolz>=1.0.0",
    "ultralytics>=8.1.2",
    "opencv-python>=4.11.0.86",
    "torch>=2.4.1",
    "torchrl>=0.5.0",
    "pyautogui>=0.9.54",
    "pillow>=10.4.0",
    "wasm>=1.2",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
    "pywin32>=310; platform_system=='Windows'",
    "tensordict>=0.5.0",
    "requests>=2.32.3",
    "micropip>=0.1.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.game]
app_name = "VORTEXION"
app_version = "1.0"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.5",
    "pygbag>=0.9.2",
]

[tool.rye.scripts]
test = { cmd = "python -m pytest", env = { PYTHONPATH = "src" } }
train_rl = { cmd = "python -m src.rl.train", env = { PYTHONPATH = "src" } }
evaluate_rl = { cmd = "python -m src.rl.evaluate", env = { PYTHONPATH = "src" } }
upload_data = { cmd = "python upload_game_data.py", env = { PYTHONPATH = "." } }
extract-config = { cmd = "python scripts/extract_config.py", env = { PYTHONPATH = "." } }
cleanup-config = { cmd = "python scripts/cleanup_config.py", env = { PYTHONPATH = "." } }
dev = { cmd = "bash -c 'python scripts/extract_config.py && python src/main.py && python scripts/cleanup_config.py'", env = { PYTHONPATH = "." } }
build = { cmd = "bash -c 'python scripts/extract_config.py && mkdir -p web/game && python -m pyxel package src src/main.py && mv src.pyxapp web/game/game.pyxapp && python scripts/cleanup_config.py'", env = { PYTHONPATH = "." } }
build-agent = { cmd = "bash -c 'python scripts/extract_config.py && mkdir -p web/agentic-game && python -m pyxel package src src/run_agent_in_game.py && mv src.pyxapp web/agentic-game/game.pyxapp && python scripts/cleanup_config.py'", env = { PYTHONPATH = "." } }
serve = { cmd = "python -m http.server 5175 -d web/game", env = { PYTHONPATH = "." } }
serve-agent = { cmd = "python -m http.server 5176 -d web/agentic-game", env = { PYTHONPATH = "." } }
clean = { cmd = "bash -c 'rm -rf web/game web/agentic-game src.pyxapp *.pyxapp'", env = { PYTHONPATH = "." } }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"] 
