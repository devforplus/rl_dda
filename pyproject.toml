[project]
name = "rl-dda-game"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "devforplus", email = "devforplus@gmail.com" }
]
dependencies = [
    "pyxel>=2.3.18",
    "pipe>=2.2",
    "toolz>=1.0.0",
    "ultralytics>=8.1.2",
    "opencv-python>=4.11.0.86",
    "torch>=2.4.1",
    "torchrl>=0.5.0",
    "pyautogui>=0.9.54",
    "pillow>=10.4.0",
    "wasm>=1.2",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
    "pywin32>=310; platform_system=='Windows'",
    "tensordict>=0.5.0",
    "requests>=2.32.3",
    "micropip>=0.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.game]
app_name = "VORTEXION"
app_version = "1.0"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.5",
    "pygbag>=0.9.2",
    "tomli>=2.2.1",
]

[tool.rye.scripts]
# Development
dev = { cmd = "python scripts/dev.py", env = { PYTHONPATH = "." } }  # Run game in development mode
test = { cmd = "python -m pytest", env = { PYTHONPATH = "src" } }  # Run tests

# Build pipeline
extract-config = { cmd = "python scripts/extract_config.py", env = { PYTHONPATH = "." } }  # Extract config files
build = { cmd = "python scripts/build.py", env = { PYTHONPATH = "." } }  # Build main game
build-agent = { cmd = "python scripts/build_agent.py", env = { PYTHONPATH = "." } }  # Build agent game
build-all = { chain = ["build", "build-agent"] }  # Build both game versions
cleanup-config = { cmd = "python scripts/cleanup_config.py", env = { PYTHONPATH = "." } }  # Clean config files

# Serve built games
serve = { cmd = "python -m http.server 5175 -d web/game", env = { PYTHONPATH = "." } }  # Serve main game (port 5175)
serve-agent = { cmd = "python -m http.server 5176 -d web/agentic-game", env = { PYTHONPATH = "." } }  # Serve agent game (port 5176)

# Cleanup
clean = { cmd = "python scripts/clean.py", env = { PYTHONPATH = "." } }  # Remove build artifacts

# Reinforcement Learning
train_rl = { cmd = "python -m src.rl.train", env = { PYTHONPATH = "src" } }  # Train RL models
evaluate_rl = { cmd = "python -m src.rl.evaluate", env = { PYTHONPATH = "src" } }  # Evaluate RL models

# Data management
upload_data = { cmd = "python upload_game_data.py", env = { PYTHONPATH = "." } }  # Upload game data

# CLI tools
cli = { cmd = "python -m scripts.cli", env = { PYTHONPATH = "." } }  # CLI tool main interface
install-browser = { cmd = "python -m scripts.cli install", env = { PYTHONPATH = "." } }  # Install browser for automation
capture-console = { cmd = "python -m scripts.cli capture", env = { PYTHONPATH = "." } }  # Capture browser console
collect-data = { cmd = "python -m scripts.cli collect", env = { PYTHONPATH = "." } }  # Collect data from websites

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"] 
